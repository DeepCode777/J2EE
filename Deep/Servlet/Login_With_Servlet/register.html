<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Register Page</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 40px;
    }

    form {
        width: 500px;
        margin: auto;
        background-color: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 0 10px #ccc;
    }

    form div {
        margin-bottom: 15px;
    }

    label {
        color: #333;
        font-weight: bold;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    textarea,
    select {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    textarea {
        width: 100%;
    }

    textarea {
        height: 80px;
        resize: vertical;
    }

    input[type="radio"] {
        margin-left: 10px;
    }

    input[type="radio"] + label {
        font-weight: normal;
    }

    a {
        color: #007bff;
        text-decoration: none;
        margin-right: 15px;
    }

    a:hover {
        text-decoration: underline;
    }

    button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        background-color: #0056b3;
    }
</style>

</head>

<body>

<div>

    <form action="registerServlet" method="post">

        <div>
            <label for="email">Email : </label>
            <input type="email" name="email" id="">
        </div>

        <div>
            <label for="password">Password : </label>
            <input type="password" name="password" id="">
        </div>

        <div>
            <label for="fullName">Full Name : </label>
            <input type="text" name="fullName" id="">
        </div>

        <div>
            <label for="gender">Gender : </label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>

            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>

            <input type="radio" name="gender" id="other" value="other">
            <label for="other">Other</label>
        </div>

        <div>
            <label for="address">Address : </label>
            <textarea name="address" id=""></textarea>
        </div>

        <div>
            <label for="city">City : </label>
            <input type="text" name="city" id="">
        </div>

        <div>
            <label for="country">Country : </label>
            <select name="country" id="">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option>
                <option value="australia">Australia</option>
            </select>
        </div>

        <div>
            <label for="dob">Date of Birth : </label>

            <label for="dob_day">Day : </label>
            <select name="dob_day" id="">
                <option value="01">01</option>
                <option value="02">02</option>
                <option value="03">03</option>
                <option value="04">04</option>
                <option value="05">05</option>
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
                <option value="23">23</option>
                <option value="24">24</option>
                <option value="25">25</option>
                <option value="26">26</option>
                <option value="27">27</option>
                <option value="28">28</option>
                <option value="29">29</option>
                <option value="30">30</option>
                <option value="31">31</option>
            </select>

            <label for="dob_month">Month : </label>
            <select name="dob_month" id="">
                <option value="01">01</option>
                <option value="02">02</option>
                <option value="03">03</option>
                <option value="04">04</option>
                <option value="05">05</option>
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
            </select>

            <label for="dob_year">Year : </label>
            <select name="dob_year" id="">
                <option value="2000">2000</option>
                <option value="2001">2001</option>
                <option value="2002">2002</option>
                <option value="2003">2003</option>
                <option value="2004">2004</option>
                <option value="2005">2005</option>
                <option value="2006">2006</option>
                <option value="2007">2007</option>
                <option value="2008">2008</option>
                <option value="2009">2009</option>
                <option value="2010">2010</option>
                <option value="2011">2011</option>
                <option value="2012">2012</option>
                <option value="2013">2013</option>
                <option value="2014">2014</option>
                <option value="2015">2015</option>
                <option value="2016">2016</option>
                <option value="2017">2017</option>
                <option value="2018">2018</option>
                <option value="2019">2019</option>
                <option value="2020">2020</option>
                <option value="2021">2021</option>
                <option value="2022">2022</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
            </select>
        </div>

        <a href="dashboard.java">create account</a>

        <div>
            <button type="submit">Log in</button>
        </div>

    </form>

</div>

</body>
</html>
